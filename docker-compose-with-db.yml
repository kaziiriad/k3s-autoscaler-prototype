# version: '3.8'  # Removed obsolete version field

services:
  # K3s Master Node
  k3s-master:
    image: rancher/k3s:v1.29.1-k3s1
    container_name: k3s-master
    hostname: k3s-master
    privileged: true
    ports:
      - "6443:6443"      # Kubernetes API
    environment:
      - K3S_TOKEN=mysupersecrettoken12345
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig
      - K3S_KUBECONFIG_MODE=666
      - K3S_DEBUG=true
      - K3S_KUBECONFIG_SERVER=https://k3s-master:6443
    volumes:
      - k3s-master-data:/var/lib/rancher/k3s
      - ./kubeconfig:/output
      - ./scripts:/scripts:ro
    command: >
      server
      --https-listen-port=6443
      --disable-network-policy
      --disable=traefik
      --disable=servicelb
      --write-kubeconfig-mode=666
      --cluster-cidr=10.42.0.0/16
      --service-cidr=10.43.0.0/16
      --tls-san=k3s-master
    networks:
      - k3s-network
    healthcheck:
      test: ["CMD", "kubectl", "get", "nodes"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Kubeconfig fixer - automatically fixes the server address
  kubeconfig-fixer:
    image: alpine:latest
    container_name: kubeconfig-fixer
    volumes:
      - ./kubeconfig:/output
      - ./fix-kubeconfig.sh:/fix-kubeconfig.sh:ro
    command: sh /fix-kubeconfig.sh
    networks:
      - k3s-network
    depends_on:
      - k3s-master
    restart: "no"

  # Monitoring deployer - automatically deploys Prometheus and monitoring stack in-cluster
  monitoring-deployer:
    image: rancher/k3s:v1.29.1-k3s1
    container_name: monitoring-deployer
    volumes:
      - ./monitoring:/manifests:ro
    command: >
      sh -c "
        echo 'Waiting for k3s-master to be ready...'
        until kubectl --server=https://k3s-master:6443 get nodes >/dev/null 2>&1; do
          echo 'Waiting for k3s-master...'
          sleep 2
        done
        echo 'k3s-master is ready, deploying monitoring stack...'
        kubectl --server=https://k3s-master:6443 apply -f /manifests/node-exporter-daemonset.yaml
        kubectl --server=https://k3s-master:6443 apply -f /manifests/node-exporter-service.yaml
        kubectl --server=https://k3s-master:6443 apply -f /manifests/kube-state-metrics.yaml
        kubectl --server=https://k3s-master:6443 apply -f /manifests/prometheus-in-cluster/
        echo 'Waiting for Prometheus pod to be ready...'
        kubectl --server=https://k3s-master:6443 wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=120s
        echo 'Monitoring stack deployed successfully!'
      "
    networks:
      - k3s-network
    depends_on:
      k3s-master:
        condition: service_healthy
    restart: "no"

  # K3s Worker Nodes
  k3s-worker-1:
    image: rancher/k3s:v1.29.1-k3s1
    container_name: k3s-worker-1
    hostname: k3s-worker-1
    privileged: true
    environment:
      - K3S_URL=https://k3s-master:6443
      - K3S_TOKEN=mysupersecrettoken12345
    volumes:
      - k3s-worker-1-data:/var/lib/rancher/k3s
    command: agent
    networks:
      - k3s-network
    depends_on:
      kubeconfig-fixer:
        condition: service_completed_successfully
    restart: unless-stopped

  k3s-worker-2:
    image: rancher/k3s:v1.29.1-k3s1
    container_name: k3s-worker-2
    hostname: k3s-worker-2
    privileged: true
    environment:
      - K3S_URL=https://k3s-master:6443
      - K3S_TOKEN=mysupersecrettoken12345
    volumes:
      - k3s-worker-2-data:/var/lib/rancher/k3s
    command: agent
    networks:
      - k3s-network
    depends_on:
      kubeconfig-fixer:
        condition: service_completed_successfully
    restart: unless-stopped

  # MongoDB for persistent storage
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=autoscaler
    networks:
      - k3s-network
    restart: unless-stopped

  # Redis for caching and cooldowns
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - k3s-network
    restart: unless-stopped

  # Prometheus for metrics collection
  # NOTE: Prometheus now runs inside the cluster as a pod
  # See monitoring/prometheus-in-cluster/ for Kubernetes manifests
  # Run: ./scripts/deploy-prometheus-in-cluster.sh
  # prometheus:
  #   image: prom/prometheus:v2.40.7
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - ./monitoring/scaling_rules.yml:/etc/prometheus/scaling_rules.yml
  #     - ./kubeconfig:/etc/prometheus/kubeconfig-ro:ro
  #     - prometheus-data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/etc/prometheus/console_libraries'
  #     - '--web.console.templates=/etc/prometheus/consoles'
  #     - '--storage.tsdb.retention.time=200h'
  #     - '--web.enable-lifecycle'
  #   networks:
  #     - k3s-network
  #   depends_on:
  #     - k3s-master
  #     - monitoring-setup
  #   restart: unless-stopped

  # AlertManager for alerting
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
    networks:
      - k3s-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/k3s-cluster-dashboard.json:/var/lib/grafana/dashboards/k3s-cluster-dashboard.json:ro
      - ./monitoring/grafana/dashboards/reconciliation-dashboard.json:/var/lib/grafana/dashboards/reconciliation-dashboard.json:ro
      - ./monitoring/grafana/dashboards/event-dashboard.json:/var/lib/grafana/dashboards/event-dashboard.json:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - k3s-network
    # depends_on:
    #   - prometheus  # Prometheus is now in-cluster
    restart: unless-stopped

  # Autoscaler Service
  autoscaler:
    image: custom-autoscaler:latest
    ports:
      - "8080:8080"
      - "9091:9091"
    volumes:
      - ./kubeconfig:/app/kubeconfig:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./autoscaler/config:/app/config:ro
    # Add group ID for Docker socket access
    group_add:
      - ${DOCKER_GID:-999}
    environment:
      - KUBECONFIG=/app/kubeconfig/kubeconfig
      - WORKER_PREFIX=k3s-worker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - MONGODB_URL=mongodb://admin:password@mongodb:27017/autoscaler?authSource=admin
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      # Reduced cooldowns for faster testing
      - SCALE_UP_COOLDOWN=10
      - SCALE_DOWN_COOLDOWN=15
      - RECONCILIATION_ENABLED=true
      - RECONCILIATION_INTERVAL=60  # seconds
      - STARTUP_RECONCILIATION=true

    networks:
      - k3s-network
    depends_on:
      - k3s-master
      - mongodb
      - redis
      - monitoring-deployer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/reconciliation/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter for the host (DEPRECATED - now runs in-cluster as DaemonSet)
  # Run: docker exec k3s-master kubectl apply -f monitoring/node-exporter-daemonset.yaml
  # node-exporter:
  #   image: prom/node-exporter:latest
  #   container_name: node-exporter
  #   ports:
  #     - "9100:9100"
  #   volumes:
  #     - /proc:/host/proc:ro
  #     - /sys:/host/sys:ro
  #     - /:/rootfs:ro
  #   command:
  #     - '--path.procfs=/host/proc'
  #     - '--path.rootfs=/rootfs'
  #     - '--path.sysfs=/host/sys'
  #     - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
  #   networks:
  #     - k3s-network
  #   restart: unless-stopped

  # Kube-state-metrics (DEPRECATED - now runs in-cluster)
  # Run: docker exec k3s-master kubectl apply -f monitoring/kube-state-metrics.yaml
  # kube-state-metrics:
  #   image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.0
  #   container_name: kube-state-metrics
  #   volumes:
  #     - ./kubeconfig:/kubeconfig:ro
  #   command:
  #     - --kubeconfig=/kubeconfig/kubeconfig
  #     - --port=8081
  #     - --telemetry-port=8082
  #   ports:
  #     - "8081:8081"
  #     - "8082:8082"
  #   networks:
  #     - k3s-network
  #     depends_on:
  #       - k3s-master
  #   restart: unless-stopped

  # Monitoring Setup Service (DEPRECATED - use deploy-monitoring-in-cluster.sh instead)
  # Now monitoring components run inside the cluster
  # Run: ./scripts/deploy-monitoring-in-cluster.sh

volumes:
  k3s-master-data:
  k3s-worker-1-data:
  k3s-worker-2-data:
  mongodb-data:
  redis-data:
  # prometheus-data:  # No longer needed - Prometheus uses PVC in-cluster
  grafana-data:
  alertmanager-data:

networks:
  k3s-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16